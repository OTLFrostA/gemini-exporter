name = "gemini-exporter-cloud-vault"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# Zero-knowledge metadata & monotonic change-sequence store (Cloudflare D1)
[[d1_databases]]
binding = "VAULT_DB"
database_name = "gemini_exporter_vault_db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with output of `wrangler d1 create gemini_exporter_vault_db`
migrations_dir = "migrations"

# Zero-knowledge encrypted conversation blob store (Cloudflare R2 - $0 egress)
[[r2_buckets]]
binding = "VAULT_BLOBS"
bucket_name = "gemini-exporter-vault-blobs"

[vars]
# Replace with your Google Cloud OAuth 2.0 Web/Extension Client ID(s)
GOOGLE_CLIENT_IDS = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
# Restrict browser CORS strictly to your published/unpacked Chrome Extension origin
ALLOWED_ORIGINS = "chrome-extension://YOUR_EXTENSION_ID"
DEFAULT_QUOTA_BYTES = "104857600"

# Set SESSION_HMAC_SECRET (>= 32 random bytes) via Cloudflare Secret, never in plaintext config:
#   openssl rand -base64 48 | npx wrangler secret put SESSION_HMAC_SECRET
