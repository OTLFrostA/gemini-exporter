name: V2 Native Detail Transport Acceptance

on:
  pull_request:
    branches: [dev/v2]
    paths:
      - 'tests/native_detail_transport.test.ts'
      - '.github/workflows/native-detail-acceptance.yml'

jobs:
  native-detail-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run native Detail v2 integration regression
        run: node -r ./tests/ts_register.js --test tests/native_detail_transport.test.ts
