name: V2 Module Unit Isolation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v2-unit-isolation.yml'
  pull_request:
    branches: [main, dev/v2]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v2-unit-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-v2-units:
    name: All module units with frozen v2 mocks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install latest stable Google Chrome and system dependencies
        run: |
          npx playwright install --with-deps chrome
          google-chrome --version
      - name: Check that the strict execution guard blocks foreign production code
        run: node --test tests/arch/v2-unit-guard.test.cjs
      - name: Type-check mocked ports against latest v2 owner definitions
        run: npm run test:v2:unit-ports
      - name: Run every v2 module-unit suite with real-external-module guard
        run: npm run test:v2:unit-isolation
