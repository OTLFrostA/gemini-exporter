name: V2 PDF export targeted verification (temporary)
on:
  pull_request:
    branches: [dev/v2]
    paths:
      - 'tests/pdf-export.test.ts'
      - '.github/workflows/v2-pdf-export-targeted.yml'
jobs:
  targeted-pdf-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run migrated PDF export integration tests
        run: node -r ./tests/ts_register.js --test tests/pdf-export.test.ts
