name: V2 Scoped Contract Verification
on:
  push:
    branches: [fix/v2-atomic-detail-live-save-coverage]
  workflow_dispatch:

jobs:
  v2-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: L2, Storage and Coverage targeted tests
        run: node -r ./tests/ts_register.js --test tests/domain_admission_storage.test.ts tests/stream_coverage.test.ts tests/six-admission-browser.test.ts
      - name: Changed-triggered Runtime and Live Save tests
        run: node -r ./tests/ts_register.js --test --test-name-pattern='Background returns Detail changed|Content ingestion preserves committed changed|passive Detail change waits|Live Save does not consult old ExportRecord|failed, unchanged and superseded Detail admissions|Live Save returns the exact unified result' tests/browser_runtime_v2.test.ts
      - name: Owned v2 TypeScript diagnostics
        run: node scripts/typecheck-v2-modules.cjs
