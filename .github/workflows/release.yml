name: Build & Release Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and remote tag
        id: check_version
        run: |
          # Read version directly from manifest.json
          VERSION=$(jq -r '.version' manifest.json)
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

          # Check if tag already exists in remote
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote."
            # If triggered directly by tag push, we still build; otherwise skip
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "Triggered by tag push, proceeding..."
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "No new version detected. Skipping release."
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "New version detected: ${TAG}! Will package and release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Package extension zip
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          ZIP_NAME="gemini-exporter-${{ env.TAG }}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          zip -r "${ZIP_NAME}" \
            manifest.json \
            _locales \
            icons \
            lib \
            public \
            *.js \
            *.css \
            *.html \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            README.md \
            README_zh.md

          ls -lh "${ZIP_NAME}"

      - name: Create Tag and GitHub Release
        if: steps.check_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Gemini Exporter ${{ env.TAG }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
