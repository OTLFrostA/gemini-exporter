name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      action:
        description: '发布方式 (Release Mode)'
        required: true
        default: 'release_current_main'
        type: choice
        options:
          - 'release_current_main'
          - 'bump_patch_and_release'
          - 'bump_minor_and_release'
          - 'custom_tag'
      custom_tag:
        description: '自定义版本号 (仅在选择 custom_tag 时生效，例如 v1.4.0)'
        required: false
        default: ''
      publish_to_store:
        description: '发布到 Chrome Web Store 商店审查 (false = 仅生成 GitHub Release)'
        required: true
        default: false
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          # A tag push must build the tagged commit. Manual releases start at main.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Determine version and lock source commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          ACTION: ${{ inputs.action }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$EVENT_TAG"
          else
            CURRENT_VER=$(jq -er '.version' manifest.json)
            PACKAGE_VER=$(jq -er '.version' package.json)
            if [[ ! "$CURRENT_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$PACKAGE_VER" != "$CURRENT_VER" ]]; then
              echo "manifest.json and package.json must have the same stable x.y.z version before release." >&2
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VER"

            case "$ACTION" in
              bump_patch_and_release)
                VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                TAG="v${VERSION}"
                jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
                mv manifest.tmp manifest.json
                jq --arg v "$VERSION" '.version = $v' package.json > package.tmp
                mv package.tmp package.json
                jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' package-lock.json > package-lock.tmp
                mv package-lock.tmp package-lock.json
                node scripts/release-prepare.js
                git add manifest.json package.json package-lock.json README.md README_zh.md
                git commit -m "chore(release): bump version to v${VERSION} [skip ci]"
                ;;
              bump_minor_and_release)
                VERSION="${MAJOR}.$((MINOR + 1)).0"
                TAG="v${VERSION}"
                jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
                mv manifest.tmp manifest.json
                jq --arg v "$VERSION" '.version = $v' package.json > package.tmp
                mv package.tmp package.json
                jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' package-lock.json > package-lock.tmp
                mv package-lock.tmp package-lock.json
                node scripts/release-prepare.js
                git add manifest.json package.json package-lock.json README.md README_zh.md
                git commit -m "chore(release): bump version to v${VERSION} [skip ci]"
                ;;
              custom_tag)
                TAG="$CUSTOM_TAG"
                ;;
              release_current_main)
                TAG="v${CURRENT_VER}"
                ;;
              *)
                echo "Unsupported release action: $ACTION" >&2
                exit 1
                ;;
            esac
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must have the form vX.Y.Z: $TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          MANIFEST_VER=$(jq -er '.version' manifest.json)
          PACKAGE_VER=$(jq -er '.version' package.json)
          if [[ "$VERSION" != "$MANIFEST_VER" || "$VERSION" != "$PACKAGE_VER" ]]; then
            echo "Tag ($VERSION), manifest.json ($MANIFEST_VER), and package.json ($PACKAGE_VER) versions must match." >&2
            exit 1
          fi

          LOCKED_SHA=$(git rev-parse HEAD)
          # Refuse to reuse any existing tag that points at a different source commit.
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            EXISTING_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [[ "$EXISTING_SHA" != "$LOCKED_SHA" ]]; then
              echo "Tag $TAG already points to $EXISTING_SHA, expected $LOCKED_SHA." >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$LOCKED_SHA" >> "$GITHUB_OUTPUT"
          echo "Locked release source: $LOCKED_SHA ($TAG)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run release test gates
        env:
          LOCKED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"
          npm test
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"

      - name: Package and verify release ZIP
        id: package
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          LOCKED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"
          npm run package
          ZIP_NAME="gemini-exporter-${TAG}.zip"
          test -s "$ZIP_NAME"

          unzip -t "$ZIP_NAME"
          unzip -p "$ZIP_NAME" manifest.json > /tmp/release-manifest.json
          ZIP_VERSION=$(jq -er '.version' /tmp/release-manifest.json)
          test "$ZIP_VERSION" = "$VERSION"
          unzip -Z1 "$ZIP_NAME" > /tmp/release-zip-files.txt
          for required in manifest.json dist/background/background.js dist/content/content.js dist/content/hook.js dist/ui/options.js dist/ui/popup.js dist/ui/sandbox/typst-compile.js; do
            grep -Fxq "$required" /tmp/release-zip-files.txt || { echo "ZIP missing required file: $required" >&2; exit 1; }
          done
          if grep -Eq '\.(ts|map)$' /tmp/release-zip-files.txt; then
            echo "ZIP contains TypeScript source or source maps." >&2
            exit 1
          fi
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
          echo "Verified $ZIP_NAME (SHA-256: $ZIP_SHA256)"
          {
            echo "## Release artifact verified"
            echo "- Tag: \`$TAG\`"
            echo "- Source commit: \`$LOCKED_SHA\`"
            echo "- ZIP: \`$ZIP_NAME\`"
            echo "- SHA-256: \`$ZIP_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          LOCKED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"
          git push origin "${LOCKED_SHA}:refs/heads/main"
          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk 'NR == 1 {print $1}')
          if [[ -z "$REMOTE_TAG_SHA" ]]; then
            REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" | awk 'NR == 1 {print $1}')
          fi
          if [[ -n "$REMOTE_TAG_SHA" ]]; then
            if [[ "$REMOTE_TAG_SHA" != "$LOCKED_SHA" ]]; then
              echo "Remote tag $TAG already points to $REMOTE_TAG_SHA, expected $LOCKED_SHA." >&2
              exit 1
            fi
            echo "Remote tag $TAG already points to the locked release commit."
          else
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.sha }}
          name: Gemini Exporter ${{ steps.release.outputs.tag }}
          files: ${{ steps.package.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Check Chrome Web Store credentials
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_store == true
        id: check_cws
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_EXT_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CWS_CLIENT_ID" || -z "$CWS_CLIENT_SECRET" || -z "$CWS_REFRESH_TOKEN" || -z "$CWS_EXT_ID" ]]; then
            echo "Chrome Web Store publishing was requested, but credentials are incomplete." >&2
            exit 1
          fi

      - name: Verify Chrome Web Store artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_store == true
        env:
          ZIP_NAME: ${{ steps.package.outputs.name }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Upload to Chrome Web Store
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_store == true
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.package.outputs.name }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
