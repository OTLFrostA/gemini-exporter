name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      zip_name: ${{ steps.package.outputs.name }}
      zip_sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_SHA is the commit selected by the pushed tag.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and source versions
        id: release
        env:
          TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must have the form vX.Y.Z: $TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          MANIFEST_VERSION=$(jq -er '.version' manifest.json)
          PACKAGE_VERSION=$(jq -er '.version' package.json)
          if [[ "$VERSION" != "$MANIFEST_VERSION" || "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag ($VERSION), manifest.json ($MANIFEST_VERSION), and package.json ($PACKAGE_VERSION) versions must match." >&2
            exit 1
          fi

          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ "$SOURCE_SHA" != "$EVENT_SHA" ]]; then
            echo "Checked out $SOURCE_SHA, but the tag event points to $EVENT_SHA." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated $TAG at $SOURCE_SHA (version $VERSION)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Permit sandboxed Playwright on Ubuntu
        run: bash scripts/setup-playwright-sandbox.sh

      - name: Run release test gates
        env:
          LOCKED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"
          npm test
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"

      - name: Package and verify release ZIP
        id: package
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          LOCKED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"
          npm run package
          ZIP_NAME="gemini-exporter-${TAG}.zip"
          test -s "$ZIP_NAME"

          unzip -t "$ZIP_NAME"
          unzip -p "$ZIP_NAME" manifest.json > /tmp/release-manifest.json
          ZIP_VERSION=$(jq -er '.version' /tmp/release-manifest.json)
          test "$ZIP_VERSION" = "$VERSION"
          unzip -Z1 "$ZIP_NAME" > /tmp/release-zip-files.txt
          for required in manifest.json dist/background/background.js dist/content/content.js dist/content/hook.js dist/ui/options.js dist/ui/popup.js dist/ui/sandbox/typst-compile.js; do
            grep -Fxq "$required" /tmp/release-zip-files.txt || { echo "ZIP missing required file: $required" >&2; exit 1; }
          done
          if grep -Eq '\.(ts|map)$' /tmp/release-zip-files.txt; then
            echo "ZIP contains TypeScript source or source maps." >&2
            exit 1
          fi
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
          echo "Verified $ZIP_NAME (SHA-256: $ZIP_SHA256)"
          {
            echo "## Release artifact verified"
            echo "- Tag: \`$TAG\`"
            echo "- Source commit: \`$LOCKED_SHA\`"
            echo "- ZIP: \`$ZIP_NAME\`"
            echo "- SHA-256: \`$ZIP_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip-${{ steps.release.outputs.tag }}
          path: ${{ steps.package.outputs.name }}
          retention-days: 7
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip-${{ needs.build.outputs.tag }}

      - name: Verify artifact SHA-256
        env:
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          test -s "$ZIP_NAME"
          ACTUAL_SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          name: Gemini Exporter ${{ needs.build.outputs.tag }}
          files: ${{ needs.build.outputs.zip_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-cws:
    name: Publish to Chrome Web Store
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions: {}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip-${{ needs.build.outputs.tag }}

      - name: Check Chrome Web Store credentials
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_EXT_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CWS_CLIENT_ID" || -z "$CWS_CLIENT_SECRET" || -z "$CWS_REFRESH_TOKEN" || -z "$CWS_EXT_ID" || -z "$CWS_PUBLISHER_ID" ]]; then
            echo "Chrome Web Store credentials are incomplete; refusing to finish the release." >&2
            exit 1
          fi

      - name: Verify artifact SHA-256 before Chrome Web Store upload
        env:
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          test -s "$ZIP_NAME"
          ACTUAL_SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Upload and publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: ${{ needs.build.outputs.zip_name }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
