name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.4.0, leave empty to use manifest.json version)'
        required: false
        default: ''
      publish_to_store:
        description: 'Submit to Chrome Web Store for review (false = draft only)'
        required: true
        default: false
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from tag
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "Triggered by git tag push: ${TAG}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            VERSION="${TAG#v}"
            echo "Triggered by manual workflow_dispatch with tag: ${TAG}"
          else
            MANIFEST_VER=$(jq -r '.version' manifest.json)
            TAG="v${MANIFEST_VER}"
            VERSION="${MANIFEST_VER}"
            echo "Triggered manually, using manifest.json version: ${TAG}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Package extension zip
        run: |
          ZIP_NAME="gemini-exporter-${{ env.TAG }}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          zip -r "${ZIP_NAME}" \
            manifest.json \
            _locales \
            icons \
            lib \
            public \
            src \
            *.js \
            *.css \
            *.html \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            README.md \
            README_zh.md

          ls -lh "${ZIP_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Gemini Exporter ${{ env.TAG }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Check Chrome Web Store credentials
        id: check_cws
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_EXT_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          if [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_REFRESH_TOKEN" ] && [ -n "$CWS_EXT_ID" ]; then
            echo "has_cws=true" >> $GITHUB_OUTPUT
            echo "Chrome Web Store credentials detected. Store upload will run."
          else
            echo "has_cws=false" >> $GITHUB_OUTPUT
            echo "Chrome Web Store credentials not configured. Skipping store upload."
          fi

      - name: Upload to Chrome Web Store
        if: steps.check_cws.outputs.has_cws == 'true'
        uses: mnao305/chrome-extension-upload@v5.0.0
        continue-on-error: true
        with:
          file-path: ${{ env.ZIP_NAME }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: ${{ github.event.inputs.publish_to_store || true }}
