name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          # GITHUB_SHA is the commit selected by the pushed tag.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate tag and source versions
        id: release
        env:
          TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must have the form vX.Y.Z: $TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          MANIFEST_VERSION=$(jq -er '.version' manifest.json)
          PACKAGE_VERSION=$(jq -er '.version' package.json)
          if [[ "$VERSION" != "$MANIFEST_VERSION" || "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag ($VERSION), manifest.json ($MANIFEST_VERSION), and package.json ($PACKAGE_VERSION) versions must match." >&2
            exit 1
          fi

          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ "$SOURCE_SHA" != "$EVENT_SHA" ]]; then
            echo "Checked out $SOURCE_SHA, but the tag event points to $EVENT_SHA." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated $TAG at $SOURCE_SHA (version $VERSION)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run release test gates
        env:
          LOCKED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"
          npm test
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"

      - name: Package and verify release ZIP
        id: package
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          LOCKED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_SHA"
          npm run package
          ZIP_NAME="gemini-exporter-${TAG}.zip"
          test -s "$ZIP_NAME"

          unzip -t "$ZIP_NAME"
          unzip -p "$ZIP_NAME" manifest.json > /tmp/release-manifest.json
          ZIP_VERSION=$(jq -er '.version' /tmp/release-manifest.json)
          test "$ZIP_VERSION" = "$VERSION"
          unzip -Z1 "$ZIP_NAME" > /tmp/release-zip-files.txt
          for required in manifest.json dist/background/background.js dist/content/content.js dist/content/hook.js dist/ui/options.js dist/ui/popup.js dist/ui/sandbox/typst-compile.js; do
            grep -Fxq "$required" /tmp/release-zip-files.txt || { echo "ZIP missing required file: $required" >&2; exit 1; }
          done
          if grep -Eq '\.(ts|map)$' /tmp/release-zip-files.txt; then
            echo "ZIP contains TypeScript source or source maps." >&2
            exit 1
          fi
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
          echo "Verified $ZIP_NAME (SHA-256: $ZIP_SHA256)"
          {
            echo "## Release artifact verified"
            echo "- Tag: \`$TAG\`"
            echo "- Source commit: \`$LOCKED_SHA\`"
            echo "- ZIP: \`$ZIP_NAME\`"
            echo "- SHA-256: \`$ZIP_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.sha }}
          name: Gemini Exporter ${{ steps.release.outputs.tag }}
          files: ${{ steps.package.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Check Chrome Web Store credentials
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_EXT_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CWS_CLIENT_ID" || -z "$CWS_CLIENT_SECRET" || -z "$CWS_REFRESH_TOKEN" || -z "$CWS_EXT_ID" || -z "$CWS_PUBLISHER_ID" ]]; then
            echo "Chrome Web Store credentials are incomplete; refusing to finish the release." >&2
            exit 1
          fi

      - name: Verify ZIP before Chrome Web Store upload
        env:
          ZIP_NAME: ${{ steps.package.outputs.name }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Upload and publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: ${{ steps.package.outputs.name }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
