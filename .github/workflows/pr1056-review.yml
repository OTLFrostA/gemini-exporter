name: V2 PR1056 Scoped Verification
on:
  push:
    branches: [fix/v2-atomic-detail-live-save-coverage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Atomic Coverage, Index, NotFound, Domain, Browser and legacy deletion tests
        run: node -r ./tests/ts_register.js --test tests/coverage_atomic_admission.test.ts tests/domain_admission_storage.test.ts tests/l1_l2_verified_deletion.test.ts tests/stream_coverage.test.ts tests/six-admission-browser.test.ts
      - name: Legacy Gemini Detail classifier regression (exclude unported UI tests)
        run: node -r ./tests/ts_register.js --test --test-name-pattern='^Batch 4 - Canonical classifyDetailError' tests/maintenance_convergence_batch4.test.ts
      - name: Live Save Runtime regression tests
        run: node -r ./tests/ts_register.js --test --test-name-pattern='Background returns Detail changed|Content ingestion preserves committed changed|passive Detail change waits|Live Save does not consult old ExportRecord|failed, unchanged and superseded Detail admissions|Live Save returns the exact unified result' tests/browser_runtime_v2.test.ts
      - name: Zero-any gate
        continue-on-error: true
        run: node scripts/check-zero-any.cjs
      - name: Scoped TypeScript checks
        continue-on-error: true
        run: node scripts/typecheck-v2-modules.cjs
