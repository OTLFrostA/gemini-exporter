name: Dark Theme Visual Preview (Temporary)

on:
  push:
    branches: [style/dark-theme-charcoal-20261024]
    paths:
      - '.github/workflows/preview-dark-ui.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check and build
        run: |
          npm run type-check
          npm run build
      - name: Also capture dark popup in anonymous screenshot fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/readme_screenshots.spec.ts')
          s = p.read_text()
          before = '    await popup.close();'
          after = """    await page.evaluate(async () => {
                  await Reflect.get(globalThis, 'uiFixture').updateSettings({ language: 'en', theme: 'dark' });
              });
              await popup.reload();
              await expect(popup.locator('html')).toHaveAttribute('data-theme', 'dark');
              await popup.locator('body').screenshot({
                  path: path.join(output, 'screenshot_popup_dark_preview.png'),
                  animations: 'disabled',
              });
              await popup.close();"""
          assert s.count(before) == 1
          p.write_text(s.replace(before, after))
          PY
      - name: Real Chromium screenshots with anonymous examples
        env:
          CAPTURE_README_SCREENSHOTS: '1'
        run: xvfb-run --auto-servernum npx playwright test tests/e2e/readme_screenshots.spec.ts --workers=1
      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-theme-preview
          path: |
            store_assets/screenshot_1_1280x800.png
            store_assets/screenshot_2_1280x800.png
            store_assets/screenshot_3_1280x800.png
            store_assets/screenshot_popup_v2.png
            store_assets/screenshot_popup_dark_preview.png
      - name: Commit screenshots to preview branch for visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ui-snapshots/dark-theme-2026-10-24
          cp store_assets/screenshot_1_1280x800.png ui-snapshots/dark-theme-2026-10-24/workbench-light-en.png
          cp store_assets/screenshot_2_1280x800.png ui-snapshots/dark-theme-2026-10-24/workbench-dark-en.png
          cp store_assets/screenshot_3_1280x800.png ui-snapshots/dark-theme-2026-10-24/workbench-light-zh.png
          cp store_assets/screenshot_popup_v2.png ui-snapshots/dark-theme-2026-10-24/popup-light-en.png
          cp store_assets/screenshot_popup_dark_preview.png ui-snapshots/dark-theme-2026-10-24/popup-dark-en.png
          git add ui-snapshots/dark-theme-2026-10-24/
          git commit -m "test(visual): capture charcoal dark theme preview"
          git push origin HEAD:style/dark-theme-charcoal-20261024
