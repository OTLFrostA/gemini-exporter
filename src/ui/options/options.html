<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Exporter</title>
<link rel="stylesheet" href="/src/ui/tour/tourGuide.css">
<style>body{font:14px system-ui;background:#f4f5fa;color:#202334;margin:24px}header,nav,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{margin-bottom:20px}h1{font-size:21px;margin:0}main{display:grid;grid-template-columns:320px 1fr;gap:24px}section,aside{background:white;border:1px solid #d7dbea;border-radius:12px;padding:18px}aside{display:flex;flex-direction:column;gap:16px}label{display:flex;gap:8px;align-items:center}button,select,input[type=search]{padding:8px;border:1px solid #bac0d5;border-radius:6px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#5146cc;color:white}.item{display:grid;grid-template-columns:20px 1fr;padding:14px 0;border-bottom:1px solid #e4e6ed;overflow-wrap:anywhere}.item small{grid-column:2;color:#667085}#list{margin-top:16px}#status{min-height:35px;overflow-wrap:anywhere}.dev-only{display:none!important}.dev-mode .dev-only{display:flex!important}[hidden]{display:none!important}small{color:#667085}a{color:#5146cc}fieldset{border:1px solid #d7dbea;border-radius:6px}#takeoutDropZone{padding:12px;border:1px dashed #bac0d5}@media(max-width:780px){main{grid-template-columns:1fr}}</style></head><body>
<header><h1>Gemini Exporter</h1><span id="syncCount"></span><span id="accountName"></span><select id="accountIdSelect" data-operation aria-label="Account" hidden></select><button id="btnTourGuide" data-en="Tutorial" data-zh="新手教程">Tutorial</button></header>
<main><aside>
<label><span data-en="Format" data-zh="格式">Format</span><select id="format" data-operation><option value="markdown">Markdown</option><option value="html">HTML</option><option value="pdf">PDF</option><option value="json">JSON</option></select></label>
<label><input type="checkbox" id="skipExported" data-operation><span data-en="Skip unchanged exports" data-zh="跳过未更改的导出">Skip unchanged exports</span></label>
<label><span data-en="Deliver to" data-zh="交付到">Deliver to</span><select id="delivery" data-operation><option value="browserDownload" data-en="Browser download" data-zh="浏览器下载">Browser download</option><option value="folderWriter" data-en="Authorized folder" data-zh="已授权文件夹">Authorized folder</option></select></label>
<div id="liveSaveControls"><label><input type="checkbox" id="liveSaveDiskToggle" data-operation><span>Live Save</span></label><p><small data-en="Saves Markdown to the authorized folder when captured conversation content really changes. Other formats or lost permission pause saving; switching back restores your enabled preference." data-zh="捕获的正文真实更新后保存 Markdown 到已授权目录。其他格式或失权时暂时暂停，切回后恢复此前开启意图。"></small></p><button id="btnSetDir" data-operation data-en="Choose / authorize folder" data-zh="选择 / 授权目录">Choose / authorize folder</button><p id="dirLabel"></p><small id="liveSaveStatus"></small></div>
<button id="btnExport" class="primary" data-operation data-en="Export selected" data-zh="导出选中对话">Export selected</button><button id="btnCancel" hidden data-en="Cancel" data-zh="取消">Cancel</button><button id="btnRetryFailed" data-operation hidden data-en="Retry failed items" data-zh="重试失败项">Retry failed items</button>
<p id="status" role="status" aria-live="polite"></p>
<fieldset><legend data-en="Local records" data-zh="本地记录">Local records</legend><button id="btnClearExported" data-operation data-en="Clear export records" data-zh="清除导出记录">Clear export records</button><button id="btnClearScan" data-operation data-en="Clear scan and export records" data-zh="清除扫描及导出记录">Clear scan and export records</button><p><small data-en="Conversations and disk files are kept." data-zh="保留对话和磁盘文件。"></small></p></fieldset>
<label><span data-en="Language" data-zh="语言">Language</span><select id="language" data-operation><option value="en">English</option><option value="zh">中文</option></select></label>
<label><input type="checkbox" id="devToggle" data-operation><span data-en="Developer mode" data-zh="开发者模式">Developer mode</span></label><label class="dev-only"><input type="checkbox" id="includeAssets" data-operation><span data-en="Include attachments" data-zh="包含附件">Include attachments</span></label>
<a id="feedbackBox" href="https://tally.so/r/Y56ZBB" target="_blank" rel="noopener noreferrer" data-en="Feedback" data-zh="反馈">Feedback</a>
</aside><section>
<nav><button id="btnSyncAll" class="primary" data-operation data-en="Scan All" data-zh="扫描会话">Scan All</button><button id="btnForceFullScan" class="dev-only" data-operation data-en="Force Full Scan" data-zh="强制完整扫描">Force Full Scan</button><button id="btnImportTakeout" data-operation data-en="Import Takeout" data-zh="导入 Takeout">Import Takeout</button><input id="takeoutFileInput" type="file" accept=".zip" hidden></nav>
<p id="takeoutDropZone" data-en="Drop a Takeout ZIP here to import into the account shown above." data-zh="将 Takeout ZIP 拖到此处，直接导入上方当前账户。">Drop a Takeout ZIP here to import into the account shown above.</p>
<div class="row"><input id="chatSearchInput" type="search" aria-label="Search title or ID"><select id="chatFilterSelect" aria-label="Export records"><option value="all" data-en="All" data-zh="全部">All</option><option value="exported" data-en="Has export record" data-zh="有导出记录">Has export record</option><option value="unexported" data-en="No export record" data-zh="无导出记录">No export record</option></select><span id="selectedStat"></span><button id="btnSelectAll" data-operation data-en="Select visible" data-zh="全选可见项">Select visible</button><button id="btnSelectNone" data-operation data-en="Select none" data-zh="全不选">Select none</button></div>
<div id="list"></div></section></main><script src="/lib/jszip.min.js"></script><script src="/dist/ui/options.js"></script></body></html>
