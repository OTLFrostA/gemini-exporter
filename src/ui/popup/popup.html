<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Exporter</title>
<style>
:root{--bg:#090a10;--card:#12131d;--border:#222436;--text:#f1f3fc;--muted:#8a92b2;--accent:#4f46e5;--accent2:#06b6d4}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.4;}
body{width:360px;margin:0;background:var(--bg);color:var(--text);padding:12px;position:relative;overflow-x:hidden;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:6px}
button{flex:1;border:0;border-radius:9px;padding:9px 10px;font-weight:600;cursor:pointer;transition:all 0.15s ease}
button:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;pointer-events:none}
button.ghost:disabled{background:#11121c;color:#6b7280;border-color:#1e2030}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 2px 8px rgba(79,70,229,0.35)}
.primary:hover{opacity:.95;box-shadow:0 4px 12px rgba(6,182,212,0.35)}
.ghost{background:#171926;color:var(--text);border:1px solid var(--border)}
.ghost:hover{background:#1f2233}
select{width:100%;background:#0e0f17;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:11px}
select:disabled{opacity:0.45;cursor:not-allowed;background:#10111a;color:#6b7280}
.label.disabled{opacity:0.45}
.log{font-size:11px;color:var(--muted);white-space:pre-wrap;max-height:80px;overflow:auto;font-family:ui-monospace,monospace;margin-top:6px}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-track{background:transparent}
.log::-webkit-scrollbar-thumb{background:#282c44;border-radius:99px}
.badge{font-size:10px;background:#171929;border:1px solid var(--border);color:#a5b4fc;padding:2px 7px;border-radius:99px}
.badge.inactive{background:#141520;color:#6b7280;border-color:#202232}
.progress{height:5px;background:#161824;border-radius:99px;overflow:hidden;margin-top:6px;display:none}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
input[type=checkbox].toggle{
  -webkit-appearance:none;appearance:none;width:26px;height:14px;background:#1e2030;border-radius:14px;position:relative;cursor:pointer;outline:none;margin:0;flex:none;transition:background 0.2s;
}
input[type=checkbox].toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--muted);border-radius:50%;transition:transform 0.2s,background 0.2s;
}
input[type=checkbox].toggle:checked{background:linear-gradient(135deg,var(--accent),var(--accent2))}
input[type=checkbox].toggle:checked::after{transform:translateX(12px);background:white}
#previewModal{display:none;position:fixed;inset:0;background:rgba(9,10,16,0.92);backdrop-filter:blur(4px);z-index:50;flex-direction:column;padding:12px;}
#previewModal.active{display:flex;}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
  <div style="display:flex;align-items:center;gap:6px">
    <b style="font-size:13px;">Gemini Exporter</b>
    <span id="countBadge" class="badge">0</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div id="langTogglePill" style="display:inline-flex;align-items:center;gap:4px;user-select:none;background:#141624;border:1px solid var(--border);padding:2px 6px;border-radius:14px;cursor:pointer;" title="Switch Language / 切换语言">
      <span id="labelLangZh" style="font-size:10px;font-weight:600;color:var(--text);transition:color .2s;cursor:pointer;">中</span>
      <input type="checkbox" id="langToggle" class="toggle">
      <span id="labelLangEn" style="font-size:10px;font-weight:600;color:var(--muted);transition:color .2s;cursor:pointer;">EN</span>
    </div>
  </div>
</div>

<!-- Card 1: Active Chat Awareness -->
<div id="chatInfoCard" class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <span id="currentChatLabel" class="label" style="margin:0;color:#818cf8;" data-i18n="currentChatLabel">当前会话</span>
    <span id="chatSlotBadge" class="badge" style="font-size:9px;">u0</span>
  </div>
  <div id="currentChatContent">
    <div id="currentChatTitle" style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px;" data-i18n="detectingChat">正在识别当前会话...</div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span id="chatTurnBadge" class="badge" style="background:#0e0f17;font-size:9px;" data-i18n="chatNoMessages">新会话</span>
    </div>
  </div>
  <div id="notGeminiNotice" style="display:none;font-size:11px;line-height:1.5;color:var(--muted);" data-i18n="popupNotGeminiDesc">当前标签不是 gemini.google.com。在 Gemini 页面打开即可一键长截图。</div>
</div>

<!-- Card 2: Quick Share & Export Actions -->
<div class="card">
  <!-- Hero Button: Long Screenshot -->
  <button id="btnScreenshot" class="primary" style="width:100%;padding:10px;font-size:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;" data-i18n="btnLongScreenshot">📸 一键生成高清长截图</button>
  
  <div class="row" style="margin-bottom:6px;">
    <button id="btnCopyMarkdown" class="ghost" style="font-size:11px;padding:8px 6px;" data-i18n="btnCopyMarkdown">📋 复制 Markdown</button>
    <button id="btnCurrent" class="ghost" style="font-size:11px;padding:8px 6px;" data-i18n="btnExportCurrent">📥 下载文件</button>
  </div>
  
  <select id="format">
    <option value="markdown" selected data-i18n="fmtMarkdown">Markdown (.md)</option>
    <option value="json_openai" data-i18n="fmtJsonOpenAI">JSON (OpenAI格式)</option>
    <option value="json" data-i18n="fmtJsonStandard">JSON (插件标准)</option>
    <option value="json_raw" data-i18n="fmtJsonRaw">JSON (Gemini原始)</option>
  </select>
  
  <div id="progWrap" class="progress"><div id="bar" class="bar"></div></div>
  <div id="log" class="log" style="display:none"></div>
</div>

<!-- Footer Portal Link -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-size:11px;">
  <span id="historyTotalSynced" style="color:var(--muted);" data-i18n="historyTotalSynced">历史已同步:</span>
  <button id="btnOptions" class="ghost" style="flex:none;padding:4px 8px;font-size:10px;border:none;color:#a5b4fc;background:transparent;cursor:pointer;" data-i18n="btnOpenWorkbench">打开完整工作台 ↗</button>
</div>

<!-- Long Screenshot Preview Lightbox -->
<div id="previewModal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <b style="font-size:12px;" data-i18n="screenshotReady">长截图生成就绪</b>
    <button id="btnClosePreview" class="ghost" style="flex:none;width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;">✕</button>
  </div>
  <div style="flex:1;overflow-y:auto;background:#050608;border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;justify-content:center;">
    <img id="previewImage" style="max-width:100%;height:auto;border-radius:4px;display:block;" alt="Screenshot Preview" />
  </div>
  <div class="row" style="margin-top:8px;">
    <button id="btnCopyImage" class="primary" style="font-size:11px;padding:8px 4px;" data-i18n="btnCopyImage">📋 复制长图</button>
    <button id="btnSaveImage" class="ghost" style="font-size:11px;padding:8px 4px;" data-i18n="btnSaveImage">💾 保存 PNG</button>
    <button id="btnSavePdf" class="ghost" style="font-size:11px;padding:8px 4px;border-color:#e11d48;color:#fda4af;" data-i18n="btnSavePdf">📄 存为 PDF</button>
  </div>
</div>

<script src="/dist/ui/popup.js"></script>
</body>
</html>
