<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gemini Exporter</title>
<style>body{font:14px system-ui;width:310px;margin:18px;color:#202334}h1{font-size:16px;overflow-wrap:anywhere}nav{display:flex;gap:5px;margin:16px 0}button{padding:9px;border:1px solid #b9bfd3;border-radius:7px;background:white;cursor:pointer}button[aria-pressed=true],#btnCurrent{background:#5146cc;color:white}button:disabled{opacity:.5;cursor:default}#btnCurrent,#btnOptions{width:100%;margin-bottom:9px}#status{min-height:38px;font-size:12px;overflow-wrap:anywhere}</style></head>
<body><h1 id="currentChatTitle">Gemini Exporter</h1><nav aria-label="Format">
<button data-format="markdown">Markdown</button><button data-format="html">HTML</button><button data-format="pdf">PDF</button><button data-format="json">JSON</button></nav>
<button id="btnCurrent" disabled data-en="Export current conversation" data-zh="导出当前对话">Export current conversation</button>
<button id="btnOptions" data-en="Open Options" data-zh="打开工作台">Open Options</button>
<p id="status" role="status" aria-live="polite"></p><script src="/lib/jszip.min.js"></script><script src="/dist/ui/popup.js"></script></body></html>
